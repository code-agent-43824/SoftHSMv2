# Portable PKCS #11 test-kit settings.
# This file stores PINs as plain text. Keep a customized copy private.

# AUTO initializes the selected SoftHSM module when the canonical token store
# contains no token. Later runs reuse it and replace only this test kit's own
# objects. This applies equally to the bundled and explicitly supplied module.
# YES enables destructive C_InitToken and C_InitPIN. NO disables them.
INITIALIZE_TOKEN=AUTO

# Comma-separated PKCS #11 function names. An excluded function is blocked
# before the module can receive the call. Existing-token mode automatically
# adds C_InitToken,C_InitPIN,C_SetPIN to this list.
EXCLUDED_FUNCTIONS=

USER_PIN=12345678
SO_PIN=12345678

# Leave SLOT_ID and TOKEN_LABEL empty for automatic selection. Set one of them
# when several initialized tokens are visible to the module.
SLOT_ID=
TOKEN_LABEL=
# Persistent RSA key. The GOST test uses its own fixed label and derived ID.
KEY_LABEL=portable-ci-rsa
OBJECT_ID_HEX=504f525441424c45
