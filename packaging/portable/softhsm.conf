# Emulate Rutoken ECP identity, slots, metadata, mechanism presentation, and
# private-key policy for compatibility testing. Normal SoftHSM mode is false.
FAKE_RUTOKEN_ECP = false
slots.mechanisms = ALL
library.reset_on_fork = false
