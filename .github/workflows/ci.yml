name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  BOTAN_VERSION: 2.19.5
  BOTAN_SHA256: dfeea0e0a6f26d6724c4af01da9a7b88487adb2d81ba7c72fcaf52db522c9ad4

jobs:
  portable-dependency-baseline:
    name: Portable baseline (OpenSSL 3.5.7 + Botan 2.19.5)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file perl pkg-config python3 unzip xz-utils zip
      - uses: actions/checkout@v7
      - name: Build the dependency combination used by portable releases
        env:
          PORTABLE_ARCH: x64
        run: scripts/portable/build-linux.sh
      - name: Verify portable product archive
        run: |
          unzip -q dist/softhsm-portable-linux-x64.zip -d portable-product
          test -f portable-product/libsofthsm2.so
          file portable-product/libsofthsm2.so
          ldd portable-product/libsofthsm2.so
          if ldd portable-product/libsofthsm2.so | grep -Eq 'lib(ssl|crypto|botan)'; then
            echo 'portable module unexpectedly depends on external crypto libraries' >&2
            exit 1
          fi
      # The Rutoken profile is the point of this fork, and until now nothing
      # exercised it on push: the client below and the whole rutoken-profile
      # gate were compiled and run only by the release workflow, so a break in
      # either surfaced at release time. Same compiler flags the test-kit
      # builder uses, so the two cannot drift apart.
      - name: "Build the vendor-neutral PKCS #11 client"
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -static-libstdc++ -static-libgcc \
            -I src/lib/pkcs11 tests/portable/portable-token-e2e.cpp \
            -ldl -o portable-token-e2e
      - name: Verify the Rutoken ECP compatibility profile
        run: |
          export HOME="$GITHUB_WORKSPACE/profile-gate-home"
          mkdir -p "$HOME"
          module="$GITHUB_WORKSPACE/portable-product/libsofthsm2.so"
          # The first load writes the default user configuration and store.
          ./portable-token-e2e probe "$module"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$HOME/softhsm/softhsm.conf"
          grep -F 'FAKE_RUTOKEN_ECP = true' "$HOME/softhsm/softhsm.conf"
          # A store whose token has never been labelled must report the
          # placeholder the device uses.
          P11_PROFILE_EXPECTED_LABEL='Rutoken ECP <no label>' \
            ./portable-token-e2e rutoken-profile "$module"
      # The other branch of the label rule, and everything the gate can only
      # reach through a session - the hardware-feature object among it, since
      # SoftHSM refuses C_OpenSession on a token that was never initialized.
      # Half a second of work, and without it those checks run at release time
      # only. PINs are throwaway values for a store this job creates and drops.
      - name: Verify the profile on an initialized token
        run: |
          export HOME="$GITHUB_WORKSPACE/profile-gate-labelled-home"
          mkdir -p "$HOME"
          module="$GITHUB_WORKSPACE/portable-product/libsofthsm2.so"
          ./portable-token-e2e probe "$module"
          # Initialization runs with the profile off: the facade presents one
          # slot holding the token, and there is no token to hold yet.
          P11_TEST_INITIALIZE_TOKEN=YES \
          P11_TEST_SO_PIN=12345678 \
          P11_TEST_USER_PIN=12345678 \
          P11_TEST_TOKEN_LABEL='Rutoken ECP' \
            ./portable-token-e2e prepare "$module" "$GITHUB_WORKSPACE/profile-gate-work"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$HOME/softhsm/softhsm.conf"
          P11_PROFILE_EXPECTED_LABEL='Rutoken ECP' \
            ./portable-token-e2e rutoken-profile "$module"
