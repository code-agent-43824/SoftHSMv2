name: Verify Linux packages

# Called by portable-release.yml once per Linux architecture, as soon as that
# architecture's build has finished: its product and test kit archives,
# downloaded on a fresh Ubuntu 26.04 runner and checked as an outside user
# would use them. The test kit's TLS block is required here; the archives
# themselves are built in an Ubuntu 20.04 container for glibc 2.31.
on:
  workflow_call:
    inputs:
      arch:
        description: Linux architecture of the archives (x64 or arm64)
        required: true
        type: string
      runner:
        description: Runner label to verify on
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Downloaded packages (Ubuntu 26.04)
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Show the system OpenSSL the TLS block uses
        run: openssl version
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-${{ inputs.arch }}
          path: downloaded
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-testkit-linux-${{ inputs.arch }}
          path: packaged-testkit
      - name: Test the downloaded test kit
        shell: bash
        run: |
          set -o pipefail
          export HOME="$RUNNER_TEMP/softhsm-user-home"
          mkdir -p "$HOME"
          test ! -e "$GITHUB_WORKSPACE/downloaded/softhsm.conf"
          grep -Fx 'directories.tokendir = ./tokens' "$GITHUB_WORKSPACE/packaged-testkit/softhsm.conf"
          cmp "$GITHUB_WORKSPACE/packaged-testkit/libsofthsm2.so" \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          P11_TLS_REQUIRED=1 bash "$GITHUB_WORKSPACE/packaged-testkit/run-test.sh" 2>&1 | \
            tee "$RUNNER_TEMP/default-test.log"
          grep -F '[LIFECYCLE] PASS: PKCS #11 calls after main, profile off and on' \
            "$RUNNER_TEMP/default-test.log"
          grep -F '[TLS] PASS: TLS with the client key in the module under FAKE_RUTOKEN_ECP' \
            "$RUNNER_TEMP/default-test.log"
          test -d "$GITHUB_WORKSPACE/packaged-testkit/tokens"
          test ! -e "$HOME/softhsm"
          grep -F '[OPENSC] PASS: packaged pkcs11-tool loaded the tested module' \
            "$RUNNER_TEMP/default-test.log"
          grep -F '[RUTOKEN-OPENSC] PASS: fork CLI info/name/local PIN and spy on isolated fake token' \
            "$RUNNER_TEMP/default-test.log"
          test -s "$GITHUB_WORKSPACE/packaged-testkit/test-output/pkcs11-tool-I.log"
          test -s "$GITHUB_WORKSPACE/packaged-testkit/test-output/pkcs11-tool-T.log"
          test -s "$GITHUB_WORKSPACE/packaged-testkit/test-output/softhsm-utilities.log"
          grep -F '[SCENARIO] BEGIN GOST:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] END GOST:' "$RUNNER_TEMP/default-test.log"
          grep -F '[IMPORT] GOST exportable generation' "$RUNNER_TEMP/default-test.log"
          if grep -F '[SKIP] GOST private-key import/export round trip' "$RUNNER_TEMP/default-test.log"; then
            echo 'bundled SoftHSM unexpectedly skipped the required GOST import/export round trip' >&2
            exit 1
          fi
          grep -F '[SCENARIO] BEGIN RSA PREPARE:' "$RUNNER_TEMP/default-test.log"
          grep -F '[IMPORT] RSA exportable generation' "$RUNNER_TEMP/default-test.log"
          if grep -F '[SKIP] RSA private-key import/export round trip' "$RUNNER_TEMP/default-test.log"; then
            echo 'bundled SoftHSM unexpectedly skipped the required RSA import/export round trip' >&2
            exit 1
          fi
          grep -F '[SCENARIO] END RSA PREPARE:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] BEGIN RSA FINISH:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] END RSA FINISH:' "$RUNNER_TEMP/default-test.log"
          if grep -F 'CKA_KEY_GEN_MECHANISM' "$RUNNER_TEMP/default-test.log"; then
            echo 'functional test unexpectedly queried CKA_KEY_GEN_MECHANISM' >&2
            exit 1
          fi
          awk '/\[SCENARIO\] BEGIN GOST:/{inside=1} inside{print} /\[SCENARIO\] END GOST:/{inside=0}' \
            "$RUNNER_TEMP/default-test.log" > "$RUNNER_TEMP/gost-scenario.log"
          awk '/\[SCENARIO\] BEGIN RSA PREPARE:/{inside=1} inside{print} /\[SCENARIO\] END RSA PREPARE:/{inside=0}' \
            "$RUNNER_TEMP/default-test.log" > "$RUNNER_TEMP/rsa-scenario.log"
          if grep -F 'CKK_RSA' "$RUNNER_TEMP/gost-scenario.log"; then
            echo 'RSA key type appeared inside the GOST scenario' >&2
            exit 1
          fi
          if grep -F 'CKK_GOSTR3410' "$RUNNER_TEMP/rsa-scenario.log"; then
            echo 'GOST key type appeared inside the RSA scenario' >&2
            exit 1
          fi
      - name: Verify alternate-library first run, reuse, and exclusion gate
        shell: bash
        run: |
          kit="$GITHUB_WORKSPACE/packaged-testkit"
          external_first_home="$RUNNER_TEMP/softhsm-external-first-home"
          mkdir -p "$external_first_home"
          HOME="$external_first_home" bash "$kit/run-test.sh" \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
            > "$RUNNER_TEMP/external-first.log" 2>&1
          grep -F '[TEST-KIT] initialize token=YES' "$RUNNER_TEMP/external-first.log"
          grep -F '[READY] fresh module load logged in without C_InitToken/C_InitPIN/C_SetPIN' \
            "$RUNNER_TEMP/external-first.log"
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/external-first.log"
          test -f "$external_first_home/softhsm/softhsm.conf"
          test -d "$external_first_home/softhsm/tokens"
          test ! -e "$GITHUB_WORKSPACE/downloaded/tokens"
          export HOME="$external_first_home"
          bash "$kit/run-test.sh" "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
            > "$RUNNER_TEMP/safe-alternate.log" 2>&1
          grep -F '[TEST-KIT] initialize token=NO' "$RUNNER_TEMP/safe-alternate.log"
          grep -F '[TEST-KIT] excluded functions=C_InitToken,C_InitPIN,C_SetPIN' \
            "$RUNNER_TEMP/safe-alternate.log"
          grep -F "[SCRIPT] using alternate PKCS #11 library directly in its original directory: $GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
            "$RUNNER_TEMP/safe-alternate.log"
          grep -F '[CLEANUP] removed ' "$RUNNER_TEMP/safe-alternate.log"
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/safe-alternate.log"
          if grep -F '[SCRIPT] copying bundled PKCS #11 library' "$RUNNER_TEMP/safe-alternate.log"; then
            echo "alternate module was unexpectedly copied" >&2
            exit 1
          fi
          if grep -F -- '-> C_InitToken' "$RUNNER_TEMP/safe-alternate.log"; then
            echo "safe alternate mode invoked C_InitToken" >&2
            exit 1
          fi
          P11_TEST_OBJECT_ID_HEX=504f525441424c46 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-alternate \
            bash "$kit/run-test.sh" "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
              > "$RUNNER_TEMP/shared-alternate.log" 2>&1
          grep -F '[TEST-KIT] initialize token=NO' "$RUNNER_TEMP/shared-alternate.log"
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/shared-alternate.log"
          test ! -e "$GITHUB_WORKSPACE/downloaded/tokens"
          find "$HOME/softhsm/tokens" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/tokens-before-profile.sha256"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$HOME/softhsm/softhsm.conf"
          "$kit/bin/portable-token-e2e" rutoken-profile \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          find "$HOME/softhsm/tokens" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/tokens-after-profile.sha256"
          cmp "$RUNNER_TEMP/tokens-before-profile.sha256" \
            "$RUNNER_TEMP/tokens-after-profile.sha256"
          P11_TEST_USER_PIN=12345678 \
            "$kit/bin/portable-token-e2e" rutoken-profile \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          P11_TEST_TOKEN_LABEL=portable-ci-token \
          P11_TEST_OBJECT_ID_HEX=504f525441424c47 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-rutoken \
            bash "$kit/run-test.sh" "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
              > "$RUNNER_TEMP/rutoken-e2e.log" 2>&1
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/rutoken-e2e.log"
          generated_home="$RUNNER_TEMP/softhsm-generated-home"
          no_template="$RUNNER_TEMP/softhsm-no-template"
          mkdir -p "$generated_home" "$no_template"
          cp "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" "$no_template/libsofthsm2.so"
          HOME="$generated_home" SOFTHSM2_CONF="$no_template/missing-override.conf" \
            "$kit/bin/portable-token-e2e" probe "$no_template/libsofthsm2.so"
          grep -F 'directories.tokendir = tokens' \
            "$generated_home/softhsm/softhsm.conf"
          test -d "$generated_home/softhsm/tokens"
          test ! -e "$no_template/tokens"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$generated_home/softhsm/softhsm.conf"
          # The placeholder label belongs to a token that carries no label of
          # its own, so one has to be created first. The profile no longer
          # lists the spare uninitialized token - software written for a
          # Rutoken reads one as a broken device and drops the whole slot list
          # - and creating the first token on slot 0 through the profile is
          # the documented way to do it.
          HOME="$generated_home" "$kit/bin/softhsm2-util" \
            --module "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
            --init-token --slot 0 --label '' --so-pin 12345678 --pin 12345678
          HOME="$generated_home" P11_PROFILE_EXPECTED_LABEL='Rutoken ECP <no label>' \
            "$kit/bin/portable-token-e2e" rutoken-profile \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          export HOME="$RUNNER_TEMP/softhsm-exclusion-home"
          mkdir -p "$HOME"
          sed -i 's/^INITIALIZE_TOKEN=AUTO$/INITIALIZE_TOKEN=YES/' "$kit/testkit.conf"
          sed -i 's/^EXCLUDED_FUNCTIONS=$/EXCLUDED_FUNCTIONS=C_InitToken,C_InitPIN,C_SetPIN/' \
            "$kit/testkit.conf"
          if bash "$kit/run-test.sh" > "$RUNNER_TEMP/exclusion-gate.log" 2>&1; then
            echo "excluded C_InitToken unexpectedly passed" >&2
            exit 1
          fi
          grep -F 'blocked excluded PKCS #11 function before invocation: C_InitToken' \
            "$RUNNER_TEMP/exclusion-gate.log"
          if grep -F -- '-> C_InitToken' "$RUNNER_TEMP/exclusion-gate.log"; then
            echo "excluded C_InitToken reached the module" >&2
            exit 1
          fi
