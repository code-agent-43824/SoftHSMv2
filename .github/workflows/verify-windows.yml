name: Verify Windows packages

# Called by portable-release.yml once per Windows architecture, as soon as
# that architecture's build has finished: its product and test kit archives,
# downloaded on a fresh runner of the same architecture and checked as an
# outside user would use them, the test kit's TLS block included.
on:
  workflow_call:
    inputs:
      arch:
        description: Windows architecture of the archives (x64, x86 or arm64)
        required: true
        type: string
      runner:
        description: Runner label to verify on
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Downloaded packages
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-${{ inputs.arch }}
          path: downloaded
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-testkit-windows-${{ inputs.arch }}
          path: packaged-testkit
      - name: Test the downloaded test kit
        shell: cmd
        run: |
          set "USERPROFILE=%RUNNER_TEMP%\softhsm-user-home"
          call "%GITHUB_WORKSPACE%\packaged-testkit\run-test.cmd"
          if errorlevel 1 exit /b %ERRORLEVEL%
          if not exist "%GITHUB_WORKSPACE%\packaged-testkit\tokens" exit /b 1
          if exist "%USERPROFILE%\softhsm" exit /b 1
          set "P11_TEST_OBJECT_ID_HEX=504f525441424c46"
          set "P11_TEST_KEY_LABEL=portable-ci-rsa-alternate"
          call "%GITHUB_WORKSPACE%\packaged-testkit\run-test.cmd" "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_OBJECT_ID_HEX="
          set "P11_TEST_KEY_LABEL="
          if exist "%CD%\downloaded\tokens" exit /b 1
          powershell -NoProfile -Command "(Get-Content -Raw '%USERPROFILE%\softhsm\softhsm.conf').Replace('FAKE_RUTOKEN_ECP = false','FAKE_RUTOKEN_ECP = true') | Set-Content -NoNewline -Encoding ascii '%USERPROFILE%\softhsm\softhsm.conf'"
          set "P11_TEST_USER_PIN=12345678"
          "%GITHUB_WORKSPACE%\packaged-testkit\bin\portable-token-e2e.exe" rutoken-profile "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_USER_PIN="
          set "P11_TEST_TOKEN_LABEL=portable-ci-token"
          set "P11_TEST_OBJECT_ID_HEX=504f525441424c47"
          set "P11_TEST_KEY_LABEL=portable-ci-rsa-rutoken"
          call "%GITHUB_WORKSPACE%\packaged-testkit\run-test.cmd" "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_TOKEN_LABEL="
          set "P11_TEST_OBJECT_ID_HEX="
          set "P11_TEST_KEY_LABEL="
          set "USERPROFILE=%RUNNER_TEMP%\softhsm-generated-home"
          mkdir "%RUNNER_TEMP%\softhsm-no-template"
          copy /y "%CD%\downloaded\softhsm2.dll" "%RUNNER_TEMP%\softhsm-no-template\softhsm2.dll"
          "%GITHUB_WORKSPACE%\packaged-testkit\bin\portable-token-e2e.exe" probe "%RUNNER_TEMP%\softhsm-no-template\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          if not exist "%USERPROFILE%\softhsm\softhsm.conf" exit /b 1
          if not exist "%USERPROFILE%\softhsm\tokens" exit /b 1
          if exist "%RUNNER_TEMP%\softhsm-no-template\tokens" exit /b 1
      - name: Verify Windows C_EX functional evidence
        shell: pwsh
        run: |
          $kitModule = "$env:GITHUB_WORKSPACE/packaged-testkit/softhsm2.dll"
          if ((Get-FileHash -Algorithm SHA256 $kitModule).Hash -ne
              (Get-FileHash -Algorithm SHA256 'downloaded/softhsm2.dll').Hash) {
            throw 'test-kit module differs from the HEAD package module'
          }
          $log = "$env:GITHUB_WORKSPACE/packaged-testkit/test-output/battery.log"
          foreach ($marker in @('C_EX_InitToken behaviour verified', 'C_EX_SetTokenName = CKR_OK', 'C_EX_SetLocalPIN = CKR_OK', 'SO trust transition, permanent freeze and text verified', 'attached/detached, chain, tamper and signer output verified', 'GOST SignedData generated by token mechanism (256)', 'GOST SignedData generated by token mechanism (512)')) {
            if (-not (Select-String -LiteralPath $log -SimpleMatch -Pattern $marker -Quiet)) { throw "missing C_EX evidence: $marker" }
          }
          # The TLS block ran in the first kit run, against the bundled module.
          foreach ($key in 'rsa', 'ec') {
            $tlsLog = "$env:GITHUB_WORKSPACE/packaged-testkit/test-output/tls/client-$key.log"
            if (-not (Select-String -LiteralPath $tlsLog -SimpleMatch -Pattern '[TLS-CLIENT] PASS' -Quiet)) { throw "missing TLS evidence: $key" }
          }
