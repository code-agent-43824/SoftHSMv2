name: Portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
  # Build and verify the whole product on every change to the trunk, once the
  # quick CI on that commit has passed: every platform builds its product and
  # test kit, every platform's archives are then verified on fresh runners,
  # and only then are they collected and published. Significant changes
  # publish; documentation-only changes stop before that.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# An automatic build for an older commit is worthless once a newer one starts,
# so supersede it. A manual release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: read

env:
  OPENSSL_GOST_USE_BUNDLE: '1'
  OPENSSL_VERSION: 3.5.8
  OPENSSL_SHA256: a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2
  GOST_ENGINE_COMMIT: 4632029f872981c9f969f1cee8b4fb590dab598b
  GOST_ENGINE_SHA256: f217905951fa5c2daed547a3795d2223891d88014157d16097da6cdb9e61133a
  GOST_LIBPROV_COMMIT: d5d381f71c90fe0c91f861784b715b189554f1f2
  GOST_LIBPROV_SHA256: 8514c1b4b1f88242c487d2afce4f1d8953f94294f37bfbf029c9b43175030666
  BOTAN_VERSION: 2.19.5
  BOTAN_SHA256: dfeea0e0a6f26d6724c4af01da9a7b88487adb2d81ba7c72fcaf52db522c9ad4

jobs:
  build-linux-x64:
    name: Build Linux x64 (glibc 2.31)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file perl pkg-config python3 unzip xz-utils zip
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        env:
          PORTABLE_ARCH: x64
        run: scripts/portable/build-linux.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-linux-x64
          unzip -q dist/softhsm-portable-linux-x64.zip \
            -d artifact/softhsm-portable-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-x64
          path: artifact/softhsm-portable-linux-x64/
          if-no-files-found: error
          retention-days: 90
      - name: Install pinned CMake
        run: bash scripts/portable/install-cmake-linux.sh
      - name: Build the test kit
        shell: bash
        env:
          OPENSC_GITHUB_TOKEN: ${{ github.token }}
          PORTABLE_PRODUCT_DIR: artifact/softhsm-portable-linux-x64
        run: |
          scripts/portable/build-test-kit-unix.sh linux-x64
          mkdir -p artifact/softhsm-testkit-linux-x64
          unzip -q dist/softhsm-testkit-linux-x64.zip -d artifact/softhsm-testkit-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-x64
          path: artifact/softhsm-testkit-linux-x64/
          if-no-files-found: error
          retention-days: 90

  build-linux-arm64:
    name: Build Linux ARM64 (glibc 2.31)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file perl pkg-config python3 unzip xz-utils zip
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        env:
          PORTABLE_ARCH: arm64
        run: scripts/portable/build-linux.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-linux-arm64
          unzip -q dist/softhsm-portable-linux-arm64.zip \
            -d artifact/softhsm-portable-linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-arm64
          path: artifact/softhsm-portable-linux-arm64/
          if-no-files-found: error
          retention-days: 90
      - name: Install pinned CMake
        run: bash scripts/portable/install-cmake-linux.sh
      - name: Build the test kit
        shell: bash
        env:
          OPENSC_GITHUB_TOKEN: ${{ github.token }}
          PORTABLE_PRODUCT_DIR: artifact/softhsm-portable-linux-arm64
        run: |
          scripts/portable/build-test-kit-unix.sh linux-arm64
          mkdir -p artifact/softhsm-testkit-linux-arm64
          unzip -q dist/softhsm-testkit-linux-arm64.zip -d artifact/softhsm-testkit-linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-arm64
          path: artifact/softhsm-testkit-linux-arm64/
          if-no-files-found: error
          retention-days: 90

  build-windows-x64:
    name: Build Windows x64
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: x64
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-x64.zip -DestinationPath artifact\softhsm-portable-windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-x64
          path: artifact/softhsm-portable-windows-x64/
          if-no-files-found: error
          retention-days: 90
      - name: Build the test kit
        shell: cmd
        env:
          OPENSC_GITHUB_TOKEN: ${{ github.token }}
          PORTABLE_ARCH: x64
          PORTABLE_PRODUCT_DIR: artifact\softhsm-portable-windows-x64
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-x64.zip' -DestinationPath 'artifact\softhsm-testkit-windows-x64'"
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-windows-x64
          path: artifact/softhsm-testkit-windows-x64/
          if-no-files-found: error
          retention-days: 90

  build-windows-x86:
    name: Build Windows x86
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: x86
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-x86.zip -DestinationPath artifact\softhsm-portable-windows-x86
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-x86
          path: artifact/softhsm-portable-windows-x86/
          if-no-files-found: error
          retention-days: 90
      - name: Build the test kit
        shell: cmd
        env:
          OPENSC_GITHUB_TOKEN: ${{ github.token }}
          PORTABLE_ARCH: x86
          PORTABLE_PRODUCT_DIR: artifact\softhsm-portable-windows-x86
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-x86.zip' -DestinationPath 'artifact\softhsm-testkit-windows-x86'"
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-windows-x86
          path: artifact/softhsm-testkit-windows-x86/
          if-no-files-found: error
          retention-days: 90

  build-windows-arm64:
    name: Build Windows ARM64
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-arm64.zip -DestinationPath artifact\softhsm-portable-windows-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-arm64
          path: artifact/softhsm-portable-windows-arm64/
          if-no-files-found: error
          retention-days: 90
      - name: Build the test kit
        shell: cmd
        env:
          OPENSC_GITHUB_TOKEN: ${{ github.token }}
          PORTABLE_ARCH: arm64
          PORTABLE_PRODUCT_DIR: artifact\softhsm-portable-windows-arm64
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-arm64.zip' -DestinationPath 'artifact\softhsm-testkit-windows-arm64'"
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-windows-arm64
          path: artifact/softhsm-testkit-windows-arm64/
          if-no-files-found: error
          retention-days: 90

  build-macos-universal:
    name: Build macOS universal
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        run: scripts/portable/build-macos.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-macos-universal
          unzip -q dist/softhsm-portable-macos-universal.zip \
            -d artifact/softhsm-portable-macos-universal
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-macos-universal
          path: artifact/softhsm-portable-macos-universal/
          if-no-files-found: error
          retention-days: 90
      - name: Build the test kit
        shell: bash
        env:
          OPENSC_GITHUB_TOKEN: ${{ github.token }}
          PORTABLE_PRODUCT_DIR: artifact/softhsm-portable-macos-universal
        run: |
          scripts/portable/build-test-kit-unix.sh macos-universal
          mkdir -p artifact/softhsm-testkit-macos-universal
          unzip -q dist/softhsm-testkit-macos-universal.zip -d artifact/softhsm-testkit-macos-universal
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-macos-universal
          path: artifact/softhsm-testkit-macos-universal/
          if-no-files-found: error
          retention-days: 90

  # Every platform's archives, product and test kit, downloaded on a fresh
  # runner and checked as an outside user would use them. Each check waits
  # only for its own build, so one platform's failure does not hold back or
  # skip the others; the steps live in verify-linux.yml, verify-windows.yml
  # and verify-macos.yml. The universal macOS archives are checked on Apple
  # silicon and on Intel.
  verify-linux-x64:
    name: Verify Linux x64
    needs: build-linux-x64
    uses: ./.github/workflows/verify-linux.yml
    with:
      arch: x64
      runner: ubuntu-26.04

  verify-linux-arm64:
    name: Verify Linux ARM64
    needs: build-linux-arm64
    uses: ./.github/workflows/verify-linux.yml
    with:
      arch: arm64
      runner: ubuntu-26.04-arm

  verify-windows-x64:
    name: Verify Windows x64
    needs: build-windows-x64
    uses: ./.github/workflows/verify-windows.yml
    with:
      arch: x64
      runner: windows-2025

  verify-windows-x86:
    name: Verify Windows x86
    needs: build-windows-x86
    uses: ./.github/workflows/verify-windows.yml
    with:
      arch: x86
      runner: windows-2025

  verify-windows-arm64:
    name: Verify Windows ARM64
    needs: build-windows-arm64
    uses: ./.github/workflows/verify-windows.yml
    with:
      arch: arm64
      runner: windows-11-arm

  verify-macos-apple-silicon:
    name: Verify macOS on Apple silicon
    needs: build-macos-universal
    uses: ./.github/workflows/verify-macos.yml
    with:
      runner: macos-15

  verify-macos-intel:
    name: Verify macOS on Intel
    needs: build-macos-universal
    uses: ./.github/workflows/verify-macos.yml
    with:
      runner: macos-15-intel

  release:
    name: Publish all verified portable packages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: [verify-linux-x64, verify-linux-arm64, verify-windows-x64, verify-windows-x86,
      verify-windows-arm64, verify-macos-apple-silicon, verify-macos-intel]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Select release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [[ ! "$REQUESTED_TAG" =~ ^v2\.7\.0-portable\.[0-9]+$ ]]; then
              echo "release_tag must match v2.7.0-portable.N" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --force --tags origin
          latest_tag=$(git tag --list 'v2.7.0-portable.*' --sort=-version:refname | sed -n '1p')
          if [ -n "$latest_tag" ]; then
            latest_commit=$(git rev-list -n 1 "$latest_tag")
            git merge-base --is-ancestor "$latest_commit" "$RELEASE_COMMIT"
            changed=$(git diff --name-only "$latest_commit" "$RELEASE_COMMIT")
          else
            changed=$(git ls-tree -r --name-only "$RELEASE_COMMIT")
          fi
          printf '%s\n' "$changed"

          documentation='^(docs/|tests/portable/README\.md$|HANDOFF\.md$|AGENTS\.md$|CLAUDE\.md$|GEMINI\.md$|\.github/copilot-instructions\.md$|README\.md$|NEWS$|CMAKE-NOTES\.md$|CMAKE-WIN-NOTES\.md$|OSX-NOTES\.md$|WIN32-NOTES\.md$|FIPS-NOTES\.md$)'
          if printf '%s\n' tests/portable/README.md | grep -Ev "$documentation" >/dev/null; then
            echo "tests/portable/README.md must remain documentation-only" >&2
            exit 1
          fi
          if ! printf '%s\n' "$changed" | grep -Ev "$documentation" >/dev/null; then
            echo "No product changes since $latest_tag; publication skipped."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_number=$(git tag --list 'v2.7.0-portable.*' |
            sed -n 's/^v2\.7\.0-portable\.\([0-9][0-9]*\)$/\1/p' |
            sort -n | tail -n 1)
          test -n "$latest_number"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=v2.7.0-portable.$((latest_number + 1))" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.release.outputs.publish == 'true'
        with:
          pattern: softhsm-*
          path: release-input
      - name: Create release archives and checksums
        if: steps.release.outputs.publish == 'true'
        run: |
          mkdir release-assets
          count=0
          for source in release-input/softhsm-*; do
            name=$(basename "$source")
            case "$name" in
              softhsm-testkit-windows-*|softhsm-portable-windows-*) ;;
              softhsm-testkit-*)
                chmod +x "$source/run-test.sh" "$source/bin/openssl" \
                  "$source/bin/pkcs11-tool" "$source/bin/portable-token-e2e" \
                  "$source/bin/softhsm2-util" "$source/bin/softhsm2-export" \
                  "$source/scripts/"*.sh
                for file in tls/bin/tls-client tls/run.sh tls/run-tls.sh tls/openssl/bin/openssl; do
                  if [ -f "$source/$file" ]; then chmod +x "$source/$file"; fi
                done ;;
              softhsm-portable-*)
                chmod +x "$source/softhsm2-util" "$source/softhsm2-export" ;;
            esac
            (cd "$source" && zip -X -9 -r "$GITHUB_WORKSPACE/release-assets/$name.zip" .)
            count=$((count + 1))
          done
          test "$count" -eq 12
          (cd release-assets && sha256sum *.zip > SHA256SUMS)
      - name: Verify release archive layout
        if: steps.release.outputs.publish == 'true'
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 12
          for archive in release-assets/*.zip; do
            if zipinfo -1 "$archive" | grep -Eq '\.zip$'; then
              echo "nested ZIP found in $archive" >&2
              exit 1
            fi
            case "$(basename "$archive")" in
              softhsm-testkit-windows-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'softhsm.conf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/softhsm.conf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'OPENSSL-GUIDE.md' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'OPENSC-SOURCE.txt' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/pkcs11-tool.exe' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.dll' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.conf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/opensc.dll' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/softhsm2-util.exe' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/softhsm2-export.exe' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/gostprov.dll' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/gost.dll' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'config/openssl-gost-engine.cnf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'scripts/verify-gost-cms.ps1' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'scripts/verify-rutoken-cms-cross.ps1' >/dev/null
                zipinfo -1 "$archive" | grep -E '^bin/libcrypto.*\.dll$' >/dev/null
                zipinfo -1 "$archive" | grep -E '^bin/libssl.*\.dll$' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'LICENSE-OpenSC.txt' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'LICENSE-GOST-Provider.txt' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/run.ps1' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/run-tls.ps1' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/openssl/bin/tls-client.exe' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/openssl/bin/openssl.exe' >/dev/null
                zipinfo -1 "$archive" | grep -E '^tls/openssl/bin/libcrypto-3.*\.dll$' >/dev/null
                zipinfo -1 "$archive" | grep -E '^tls/openssl/bin/libssl-3.*\.dll$' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/openssl/lib/ossl-modules/pkcs11.dll' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/openssl/LICENSE-OpenSSL.txt' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/provider/COPYING' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'tls/provider/LICENSES/winpthreads-COPYING' >/dev/null
                if zipinfo -1 "$archive" | grep -E '^tls/openssl/bin/.*[^/]$' | grep -Ev '\.(dll|exe)$'; then
                  echo "unexpected files in tls/openssl/bin of $archive" >&2
                  exit 1
                fi
                ;;
              softhsm-testkit-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'softhsm.conf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/softhsm.conf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'OPENSSL-GUIDE.md' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'OPENSC-SOURCE.txt' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/pkcs11-tool' >/dev/null
                zipinfo -1 "$archive" | grep -E '^lib/pkcs11-spy\.(so|dylib)$' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.conf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/softhsm2-util' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/softhsm2-export' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'LICENSE-OpenSC.txt' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'LICENSE-GOST-Provider.txt' >/dev/null
                case "$(basename "$archive")" in
                  *macos-*)
                    zipinfo -1 "$archive" | grep -Fx 'bin/gostprov.dylib' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'bin/gost.dylib' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'bin/libcrypto.3.dylib' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'bin/libssl.3.dylib' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/run.sh' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/run-tls.sh' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/bin/tls-client' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/openssl/bin/openssl' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/openssl/lib/libcrypto.3.dylib' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/openssl/lib/libssl.3.dylib' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/openssl/lib/ossl-modules/pkcs11.dylib' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/openssl/LICENSE-OpenSSL.txt' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/provider/COPYING' >/dev/null
                    zipinfo "$archive" tls/bin/tls-client | grep -Eq '^-rwx'
                    zipinfo "$archive" tls/openssl/bin/openssl | grep -Eq '^-rwx' ;;
                  *)
                    zipinfo -1 "$archive" | grep -Fx 'bin/gostprov.so' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'bin/gost.so' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'bin/libcrypto.so.3' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'bin/libssl.so.3' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/run.sh' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/run-tls.sh' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/bin/tls-client' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/provider/lib/ossl-modules/pkcs11.so' >/dev/null
                    zipinfo -1 "$archive" | grep -Fx 'tls/provider/COPYING' >/dev/null
                    zipinfo "$archive" tls/bin/tls-client | grep -Eq '^-rwx' ;;
                esac
                zipinfo -1 "$archive" | grep -Fx 'config/openssl-gost-engine.cnf' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'scripts/verify-gost-cms.sh' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'scripts/verify-rutoken-cms-cross.sh' >/dev/null
                if zipinfo -1 "$archive" | grep -Fx 'bin/opensc-lib/pkcs11-tool' >/dev/null; then
                  echo "duplicate pkcs11-tool found in $archive" >&2
                  exit 1
                fi
                ;;
              softhsm-portable-windows-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'softhsm2-util.exe' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'softhsm2-export.exe' >/dev/null
                ;;
              softhsm-portable-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'softhsm2-util' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'softhsm2-export' >/dev/null
                ;;
            esac
          done
          python3 - <<'PY'
          import stat
          import zipfile
          from pathlib import Path

          for archive in Path('release-assets').glob('*.zip'):
              name = archive.name
              if '-windows-' in name:
                  continue
              required = (['bin/openssl', 'bin/pkcs11-tool', 'bin/portable-token-e2e',
                           'bin/softhsm2-util', 'bin/softhsm2-export', 'run-test.sh']
                          if name.startswith('softhsm-testkit-')
                          else ['softhsm2-util', 'softhsm2-export'])
              with zipfile.ZipFile(archive) as package:
                  for path in required:
                      mode = package.getinfo(path).external_attr >> 16
                      if not mode & stat.S_IXUSR:
                          raise SystemExit(f'{archive}: {path} is not executable')
          PY
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$AUTOMATIC" = true ]; then
              echo "Automatically selected tag already exists: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_COMMIT" \
              --title "SoftHSM portable $RELEASE_TAG" \
              --notes "Portable, installer-free PKCS #11 modules and self-contained test kits for Linux x64/ARM64, Windows x86/x64/ARM64, and macOS universal. Configuration priority: an existing readable SOFTHSM2_CONF file; then softhsm.conf (or softhsm2.conf) beside the loaded module; then the canonical per-user configuration and token store. Relative token paths resolve from the chosen config file. The process working directory and system config paths are not searched. softhsm2-util finds the module beside itself, one level above, or two levels above from tools/bin; its configuration follows that module. Each test kit bundles an adjacent softhsm.conf and stores its normal test token in its own tokens directory. AUTO is refused for an explicit override or an alternate module with adjacent configuration. The independently verified kits include OpenSSL with GOST, OpenSC, GOST/RSA/CSR/certificate/CMS tests, and retain evidence under test-output. All six platform archives are checked on fresh runners before publication."
          fi
