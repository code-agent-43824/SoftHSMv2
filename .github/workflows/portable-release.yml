name: Portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v2.7.0-portable.13

permissions:
  contents: read

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  BOTAN_VERSION: 2.19.5
  BOTAN_SHA256: dfeea0e0a6f26d6724c4af01da9a7b88487adb2d81ba7c72fcaf52db522c9ad4

jobs:
  build-linux-x64:
    name: Build Linux x64 (glibc 2.31)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 unzip xz-utils zip
      - uses: actions/checkout@v7
      - name: Build package
        env:
          PORTABLE_ARCH: x64
        run: scripts/portable/build-linux.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-linux-x64
          unzip -q dist/softhsm-portable-linux-x64.zip \
            -d artifact/softhsm-portable-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-x64
          path: artifact/softhsm-portable-linux-x64/
          if-no-files-found: error
          retention-days: 90

  build-linux-arm64:
    name: Build Linux ARM64 (glibc 2.31)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 unzip xz-utils zip
      - uses: actions/checkout@v7
      - name: Build package
        env:
          PORTABLE_ARCH: arm64
        run: scripts/portable/build-linux.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-linux-arm64
          unzip -q dist/softhsm-portable-linux-arm64.zip \
            -d artifact/softhsm-portable-linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-arm64
          path: artifact/softhsm-portable-linux-arm64/
          if-no-files-found: error
          retention-days: 90

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: x64
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-x64.zip -DestinationPath artifact\softhsm-portable-windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-x64
          path: artifact/softhsm-portable-windows-x64/
          if-no-files-found: error
          retention-days: 90

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-arm64.zip -DestinationPath artifact\softhsm-portable-windows-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-arm64
          path: artifact/softhsm-portable-windows-arm64/
          if-no-files-found: error
          retention-days: 90

  build-macos-universal:
    name: Build macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        run: scripts/portable/build-macos.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-macos-universal
          unzip -q dist/softhsm-portable-macos-universal.zip \
            -d artifact/softhsm-portable-macos-universal
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-macos-universal
          path: artifact/softhsm-portable-macos-universal/
          if-no-files-found: error
          retention-days: 90

  verify-linux-x64:
    name: Verify downloaded Linux x64 package
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file perl unzip zip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-x64
          path: downloaded
      - name: Build and test downloadable test kit
        shell: bash
        env:
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          set -o pipefail
          mkdir -p dist artifact-testkit
          scripts/portable/build-test-kit-unix.sh linux-x64
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-linux-x64.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" 2>&1 | \
            tee "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] BEGIN GOST:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] END GOST:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] BEGIN RSA PREPARE:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] END RSA PREPARE:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] BEGIN RSA FINISH:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] END RSA FINISH:' "$RUNNER_TEMP/default-test.log"
          if grep -F 'CKA_KEY_GEN_MECHANISM' "$RUNNER_TEMP/default-test.log"; then
            echo 'functional test unexpectedly queried CKA_KEY_GEN_MECHANISM' >&2
            exit 1
          fi
          awk '/\[SCENARIO\] BEGIN GOST:/{inside=1} inside{print} /\[SCENARIO\] END GOST:/{inside=0}' \
            "$RUNNER_TEMP/default-test.log" > "$RUNNER_TEMP/gost-scenario.log"
          awk '/\[SCENARIO\] BEGIN RSA PREPARE:/{inside=1} inside{print} /\[SCENARIO\] END RSA PREPARE:/{inside=0}' \
            "$RUNNER_TEMP/default-test.log" > "$RUNNER_TEMP/rsa-scenario.log"
          if grep -F 'CKK_RSA' "$RUNNER_TEMP/gost-scenario.log"; then
            echo 'RSA key type appeared inside the GOST scenario' >&2
            exit 1
          fi
          if grep -F 'CKK_GOSTR3410' "$RUNNER_TEMP/rsa-scenario.log"; then
            echo 'GOST key type appeared inside the RSA scenario' >&2
            exit 1
          fi
          unzip -q dist/softhsm-testkit-linux-x64.zip -d artifact-testkit
      - name: Verify safe alternate-library defaults and exclusion gate
        run: |
          kit="$RUNNER_TEMP/packaged-testkit"
          if bash "$kit/run-test.sh" "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
              > "$RUNNER_TEMP/safe-alternate.log" 2>&1; then
            echo "uninitialized alternate module unexpectedly passed" >&2
            exit 1
          fi
          grep -F '[TEST-KIT] initialize token=NO' "$RUNNER_TEMP/safe-alternate.log"
          grep -F '[TEST-KIT] excluded functions=C_InitToken,C_InitPIN,C_SetPIN' \
            "$RUNNER_TEMP/safe-alternate.log"
          if grep -F -- '-> C_InitToken' "$RUNNER_TEMP/safe-alternate.log"; then
            echo "safe alternate mode invoked C_InitToken" >&2
            exit 1
          fi
          sed -i 's/^INITIALIZE_TOKEN=AUTO$/INITIALIZE_TOKEN=YES/' "$kit/testkit.conf"
          sed -i 's/^EXCLUDED_FUNCTIONS=$/EXCLUDED_FUNCTIONS=C_InitToken,C_InitPIN,C_SetPIN/' \
            "$kit/testkit.conf"
          if bash "$kit/run-test.sh" > "$RUNNER_TEMP/exclusion-gate.log" 2>&1; then
            echo "excluded C_InitToken unexpectedly passed" >&2
            exit 1
          fi
          grep -F 'blocked excluded PKCS #11 function before invocation: C_InitToken' \
            "$RUNNER_TEMP/exclusion-gate.log"
          if grep -F -- '-> C_InitToken' "$RUNNER_TEMP/exclusion-gate.log"; then
            echo "excluded C_InitToken reached the module" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-x64
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-linux-arm64:
    name: Verify downloaded Linux ARM64 package
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file perl unzip zip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-arm64
          path: downloaded
      - name: Build and test downloadable test kit
        env:
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          mkdir -p dist artifact-testkit
          scripts/portable/build-test-kit-unix.sh linux-arm64
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-linux-arm64.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh"
          unzip -q dist/softhsm-testkit-linux-arm64.zip -d artifact-testkit
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-arm64
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-windows-x64:
    name: Verify downloaded Windows x64 package
    needs: build-windows-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-x64
          path: downloaded
      - name: Build and test downloadable test kit
        shell: cmd
        env:
          PORTABLE_ARCH: x64
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-x64.zip' -DestinationPath $env:RUNNER_TEMP\packaged-testkit"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_INITIALIZE_TOKEN=YES"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd" "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_INITIALIZE_TOKEN="
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-x64.zip' -DestinationPath 'artifact-testkit'"
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-windows-x64
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-windows-arm64:
    name: Verify downloaded Windows ARM64 package
    needs: build-windows-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-arm64
          path: downloaded
      - name: Build and test downloadable test kit
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-arm64.zip' -DestinationPath $env:RUNNER_TEMP\packaged-testkit"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_INITIALIZE_TOKEN=YES"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd" "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_INITIALIZE_TOKEN="
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-arm64.zip' -DestinationPath 'artifact-testkit'"
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-windows-arm64
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-macos-universal:
    name: Verify downloaded macOS universal package
    needs: build-macos-universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-macos-universal
          path: downloaded
      - name: Build and test downloadable test kit
        env:
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          mkdir -p dist artifact-testkit
          scripts/portable/build-test-kit-unix.sh macos-universal
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-macos-universal.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh"
          unzip -q dist/softhsm-testkit-macos-universal.zip -d artifact-testkit
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-macos-universal
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish all verified portable packages
    needs:
      - verify-linux-x64
      - verify-linux-arm64
      - verify-windows-x64
      - verify-windows-arm64
      - verify-macos-universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: softhsm-*
          path: release-input
      - name: Create release archives and checksums
        run: |
          mkdir release-assets
          count=0
          for source in release-input/softhsm-*; do
            name=$(basename "$source")
            (cd "$source" && zip -X -9 -r "$GITHUB_WORKSPACE/release-assets/$name.zip" .)
            count=$((count + 1))
          done
          test "$count" -eq 10
          (cd release-assets && sha256sum *.zip > SHA256SUMS)
      - name: Verify release archive layout
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 10
          for archive in release-assets/*.zip; do
            if zipinfo -1 "$archive" | grep -Eq '\.zip$'; then
              echo "nested ZIP found in $archive" >&2
              exit 1
            fi
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "SoftHSM portable $RELEASE_TAG" \
              --notes "Portable, installer-free PKCS #11 modules and independently downloadable self-contained test kits for Linux x64/ARM64, Windows x64/ARM64, and macOS universal. Extract a matching test-kit ZIP and run run-test.cmd or bash run-test.sh with no arguments: the bundled SoftHSM module and configuration are selected automatically. To test another library, pass its path as the only argument. The included testkit.conf controls AUTO/YES/NO initialization, user/SO PINs, slot/labels, and a comma-separated exclusion list of PKCS #11 C_* functions. AUTO initializes only the bundled disposable SoftHSM; alternate libraries use safe existing-token mode, which blocks C_InitToken, C_InitPIN, and C_SetPIN before invocation. GOST and RSA scenarios have explicit non-overlapping trace boundaries, distinct labels/IDs and key-type-qualified searches; the functional test does not query CKA_KEY_GEN_MECHANISM. CI tests the full default path, scenario separation, explicit-library path, safe AUTO behavior, and the pre-invocation exclusion guard. Test kits include the module, precompiled client, static OpenSSL, launchers, source, headers, licenses, and environment manifest. GitHub Actions artifacts contain direct payload without nested ZIPs; SHA256SUMS covers all five product and five test-kit archives."
          fi
