name: Portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v2.7.0-portable.7

permissions:
  contents: read

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  BOTAN_VERSION: 2.19.5
  BOTAN_SHA256: dfeea0e0a6f26d6724c4af01da9a7b88487adb2d81ba7c72fcaf52db522c9ad4

jobs:
  build-linux-x64:
    name: Build Linux x64 (glibc 2.31)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 xz-utils zip
      - uses: actions/checkout@v7
      - name: Build package
        env:
          PORTABLE_ARCH: x64
        run: scripts/portable/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-x64
          path: dist/softhsm-portable-linux-x64.zip
          if-no-files-found: error
          retention-days: 90

  build-linux-arm64:
    name: Build Linux ARM64 (glibc 2.31)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 xz-utils zip
      - uses: actions/checkout@v7
      - name: Build package
        env:
          PORTABLE_ARCH: arm64
        run: scripts/portable/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-arm64
          path: dist/softhsm-portable-linux-arm64.zip
          if-no-files-found: error
          retention-days: 90

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: x64
        run: scripts\portable\build-windows.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-x64
          path: dist/softhsm-portable-windows-x64.zip
          if-no-files-found: error
          retention-days: 90

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
        run: scripts\portable\build-windows.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-arm64
          path: dist/softhsm-portable-windows-arm64.zip
          if-no-files-found: error
          retention-days: 90

  build-macos-universal:
    name: Build macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        run: scripts/portable/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-macos-universal
          path: dist/softhsm-portable-macos-universal.zip
          if-no-files-found: error
          retention-days: 90

  verify-linux-x64:
    name: Verify downloaded Linux x64 package
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates g++ openssl unzip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-x64
          path: downloaded
      - name: Test downloaded package
        run: tests/portable/run-fresh-integration.sh downloaded/softhsm-portable-linux-x64.zip libsofthsm2.so "$(command -v openssl)"

  verify-linux-arm64:
    name: Verify downloaded Linux ARM64 package
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates g++ openssl unzip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-arm64
          path: downloaded
      - name: Test downloaded package
        run: tests/portable/run-fresh-integration.sh downloaded/softhsm-portable-linux-arm64.zip libsofthsm2.so "$(command -v openssl)"

  verify-windows-x64:
    name: Verify downloaded Windows x64 package
    needs: build-windows-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-x64
          path: downloaded
      - name: Test downloaded package
        shell: cmd
        env:
          PORTABLE_ARCH: x64
        run: tests\portable\run-fresh-windows.cmd downloaded\softhsm-portable-windows-x64.zip

  verify-windows-arm64:
    name: Verify downloaded Windows ARM64 package
    needs: build-windows-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-arm64
          path: downloaded
      - name: Test downloaded package
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
        run: tests\portable\run-fresh-windows.cmd downloaded\softhsm-portable-windows-arm64.zip

  verify-macos-universal:
    name: Verify downloaded macOS universal package
    needs: build-macos-universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-macos-universal
          path: downloaded
      - name: Test downloaded package
        env:
          CXX: clang++
        run: |
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          tests/portable/run-fresh-integration.sh \
            downloaded/softhsm-portable-macos-universal.zip \
            libsofthsm2.dylib "$openssl"

  release:
    name: Publish all verified portable packages
    needs:
      - verify-linux-x64
      - verify-linux-arm64
      - verify-windows-x64
      - verify-windows-arm64
      - verify-macos-universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: softhsm-portable-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "SoftHSM portable $RELEASE_TAG" \
              --notes "Portable, installer-free PKCS #11 modules for Linux, Windows, and macOS. This release adds minimal GOST R 34.10-2012/256 signing: raw 32-byte-digest CKM_GOSTR3410 and the TC26 CKM_GOSTR3410_WITH_GOSTR3411_2012_256 mechanism in one-shot and multipart C_Sign operations. Key generation and Streebog-256 remain supported, backed by a minimized static Botan build; GOST verification, key agreement, and CMS remain disabled. Every package is built on one runner, uploaded, then downloaded and tested on a separate fresh runner. The direct PKCS #11 C++ test generates a GOST key pair, signs raw and internally hashed data, and independently checks every signature with the GOST verification equation, while retaining the RSA/CSR/certificate/CMS and RFC 6986 checks."
          fi
