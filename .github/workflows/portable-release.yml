name: Portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v2.7.0-portable.23
  # Build and verify the whole product on every change to the trunk, once the
  # quick CI on that commit has passed. Only a manual dispatch publishes a
  # release; an automatic run stops after the six verification jobs and leaves
  # the archives as run artifacts.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# An automatic build for an older commit is worthless once a newer one starts,
# so supersede it. A manual release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: read

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  BOTAN_VERSION: 2.19.5
  BOTAN_SHA256: dfeea0e0a6f26d6724c4af01da9a7b88487adb2d81ba7c72fcaf52db522c9ad4
  OPENSC_VERSION: 0.27.1
  OPENSC_MACOS_SHA256: 61c2c7b9329a65e43a34151016530d54859561d8fbbe7a723911119abf0ccd7f
  OPENSC_WINDOWS_X86_SHA256: e3cc46e14bc3c49054f974928440f748039d142855690766e997f2567c461bce
  OPENSC_WINDOWS_X64_SHA256: 2df6fb9078c5a6fc97d221f111158cb3f887e1e3c2dbb6892f58455a7015b5b8
  OPENSC_WINDOWS_ARM64_SHA256: cbf5a60d9e9195cb51d3b48dfed4441eff3b158d067196c88f1568c038f6d716

jobs:
  build-linux-x64:
    name: Build Linux x64 (glibc 2.31)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 unzip xz-utils zip
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        env:
          PORTABLE_ARCH: x64
        run: scripts/portable/build-linux.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-linux-x64
          unzip -q dist/softhsm-portable-linux-x64.zip \
            -d artifact/softhsm-portable-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-x64
          path: artifact/softhsm-portable-linux-x64/
          if-no-files-found: error
          retention-days: 90

  build-linux-arm64:
    name: Build Linux ARM64 (glibc 2.31)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 unzip xz-utils zip
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        env:
          PORTABLE_ARCH: arm64
        run: scripts/portable/build-linux.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-linux-arm64
          unzip -q dist/softhsm-portable-linux-arm64.zip \
            -d artifact/softhsm-portable-linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-arm64
          path: artifact/softhsm-portable-linux-arm64/
          if-no-files-found: error
          retention-days: 90

  build-windows-x64:
    name: Build Windows x64
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: x64
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-x64.zip -DestinationPath artifact\softhsm-portable-windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-x64
          path: artifact/softhsm-portable-windows-x64/
          if-no-files-found: error
          retention-days: 90

  build-windows-x86:
    name: Build Windows x86
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: x86
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-x86.zip -DestinationPath artifact\softhsm-portable-windows-x86
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-x86
          path: artifact/softhsm-portable-windows-x86/
          if-no-files-found: error
          retention-days: 90

  build-windows-arm64:
    name: Build Windows ARM64
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
        run: scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        shell: powershell
        run: Expand-Archive -LiteralPath dist\softhsm-portable-windows-arm64.zip -DestinationPath artifact\softhsm-portable-windows-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-arm64
          path: artifact/softhsm-portable-windows-arm64/
          if-no-files-found: error
          retention-days: 90

  build-macos-universal:
    name: Build macOS universal
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build package
        run: scripts/portable/build-macos.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/softhsm-portable-macos-universal
          unzip -q dist/softhsm-portable-macos-universal.zip \
            -d artifact/softhsm-portable-macos-universal
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-macos-universal
          path: artifact/softhsm-portable-macos-universal/
          if-no-files-found: error
          retention-days: 90

  verify-linux-x64:
    name: Verify downloaded Linux x64 package
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file opensc patchelf perl unzip zip
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-x64
          path: downloaded
      - name: Build and test downloadable test kit
        shell: bash
        env:
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          set -o pipefail
          export HOME="$RUNNER_TEMP/softhsm-user-home"
          mkdir -p "$HOME"
          mkdir -p dist artifact-testkit
          scripts/portable/build-test-kit-unix.sh linux-x64
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-linux-x64.zip -d "$RUNNER_TEMP/packaged-testkit"
          test ! -e "$GITHUB_WORKSPACE/downloaded/softhsm.conf"
          test ! -e "$RUNNER_TEMP/packaged-testkit/softhsm.conf"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" 2>&1 | \
            tee "$RUNNER_TEMP/default-test.log"
          grep -F '[OPENSC] PASS: packaged pkcs11-tool loaded the tested module' \
            "$RUNNER_TEMP/default-test.log"
          test -s "$RUNNER_TEMP/packaged-testkit/test-output/pkcs11-tool-I.log"
          test -s "$RUNNER_TEMP/packaged-testkit/test-output/pkcs11-tool-T.log"
          grep -F '[SCENARIO] BEGIN GOST:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] END GOST:' "$RUNNER_TEMP/default-test.log"
          grep -F '[IMPORT] GOST exportable generation' "$RUNNER_TEMP/default-test.log"
          if grep -F '[SKIP] GOST private-key import/export round trip' "$RUNNER_TEMP/default-test.log"; then
            echo 'bundled SoftHSM unexpectedly skipped the required GOST import/export round trip' >&2
            exit 1
          fi
          grep -F '[SCENARIO] BEGIN RSA PREPARE:' "$RUNNER_TEMP/default-test.log"
          grep -F '[IMPORT] RSA exportable generation' "$RUNNER_TEMP/default-test.log"
          if grep -F '[SKIP] RSA private-key import/export round trip' "$RUNNER_TEMP/default-test.log"; then
            echo 'bundled SoftHSM unexpectedly skipped the required RSA import/export round trip' >&2
            exit 1
          fi
          grep -F '[SCENARIO] END RSA PREPARE:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] BEGIN RSA FINISH:' "$RUNNER_TEMP/default-test.log"
          grep -F '[SCENARIO] END RSA FINISH:' "$RUNNER_TEMP/default-test.log"
          if grep -F 'CKA_KEY_GEN_MECHANISM' "$RUNNER_TEMP/default-test.log"; then
            echo 'functional test unexpectedly queried CKA_KEY_GEN_MECHANISM' >&2
            exit 1
          fi
          awk '/\[SCENARIO\] BEGIN GOST:/{inside=1} inside{print} /\[SCENARIO\] END GOST:/{inside=0}' \
            "$RUNNER_TEMP/default-test.log" > "$RUNNER_TEMP/gost-scenario.log"
          awk '/\[SCENARIO\] BEGIN RSA PREPARE:/{inside=1} inside{print} /\[SCENARIO\] END RSA PREPARE:/{inside=0}' \
            "$RUNNER_TEMP/default-test.log" > "$RUNNER_TEMP/rsa-scenario.log"
          if grep -F 'CKK_RSA' "$RUNNER_TEMP/gost-scenario.log"; then
            echo 'RSA key type appeared inside the GOST scenario' >&2
            exit 1
          fi
          if grep -F 'CKK_GOSTR3410' "$RUNNER_TEMP/rsa-scenario.log"; then
            echo 'GOST key type appeared inside the RSA scenario' >&2
            exit 1
          fi
          unzip -q dist/softhsm-testkit-linux-x64.zip -d artifact-testkit
      - name: Verify alternate-library first run, reuse, and exclusion gate
        run: |
          kit="$RUNNER_TEMP/packaged-testkit"
          external_first_home="$RUNNER_TEMP/softhsm-external-first-home"
          mkdir -p "$external_first_home"
          HOME="$external_first_home" bash "$kit/run-test.sh" \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
            > "$RUNNER_TEMP/external-first.log" 2>&1
          grep -F '[TEST-KIT] initialize token=YES' "$RUNNER_TEMP/external-first.log"
          grep -F '[READY] fresh module load logged in without C_InitToken/C_InitPIN/C_SetPIN' \
            "$RUNNER_TEMP/external-first.log"
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/external-first.log"
          test -f "$external_first_home/softhsm/softhsm.conf"
          test -d "$external_first_home/softhsm/tokens"
          test ! -e "$GITHUB_WORKSPACE/downloaded/tokens"
          export HOME="$RUNNER_TEMP/softhsm-user-home"
          bash "$kit/run-test.sh" "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
            > "$RUNNER_TEMP/safe-alternate.log" 2>&1
          grep -F '[TEST-KIT] initialize token=NO' "$RUNNER_TEMP/safe-alternate.log"
          grep -F '[TEST-KIT] excluded functions=C_InitToken,C_InitPIN,C_SetPIN' \
            "$RUNNER_TEMP/safe-alternate.log"
          grep -F "[SCRIPT] using alternate PKCS #11 library directly in its original directory: $GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
            "$RUNNER_TEMP/safe-alternate.log"
          grep -F '[CLEANUP] removed ' "$RUNNER_TEMP/safe-alternate.log"
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/safe-alternate.log"
          if grep -F '[SCRIPT] copying bundled PKCS #11 library' "$RUNNER_TEMP/safe-alternate.log"; then
            echo "alternate module was unexpectedly copied" >&2
            exit 1
          fi
          if grep -F -- '-> C_InitToken' "$RUNNER_TEMP/safe-alternate.log"; then
            echo "safe alternate mode invoked C_InitToken" >&2
            exit 1
          fi
          P11_TEST_OBJECT_ID_HEX=504f525441424c46 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-alternate \
            bash "$kit/run-test.sh" "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
              > "$RUNNER_TEMP/shared-alternate.log" 2>&1
          grep -F '[TEST-KIT] initialize token=NO' "$RUNNER_TEMP/shared-alternate.log"
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/shared-alternate.log"
          test ! -e "$GITHUB_WORKSPACE/downloaded/tokens"
          find "$HOME/softhsm/tokens" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/tokens-before-profile.sha256"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$HOME/softhsm/softhsm.conf"
          "$kit/bin/portable-token-e2e" rutoken-profile \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          find "$HOME/softhsm/tokens" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/tokens-after-profile.sha256"
          cmp "$RUNNER_TEMP/tokens-before-profile.sha256" \
            "$RUNNER_TEMP/tokens-after-profile.sha256"
          P11_TEST_TOKEN_LABEL=portable-ci-token \
          P11_TEST_OBJECT_ID_HEX=504f525441424c47 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-rutoken \
            bash "$kit/run-test.sh" "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" \
              > "$RUNNER_TEMP/rutoken-e2e.log" 2>&1
          grep -F '[SCRIPT] PASS: standard direct PKCS #11 and external OpenSSL integration test completed' \
            "$RUNNER_TEMP/rutoken-e2e.log"
          generated_home="$RUNNER_TEMP/softhsm-generated-home"
          no_template="$RUNNER_TEMP/softhsm-no-template"
          mkdir -p "$generated_home" "$no_template"
          cp "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" "$no_template/libsofthsm2.so"
          printf 'this adjacent config must never be parsed\n' > "$no_template/softhsm.conf"
          HOME="$generated_home" SOFTHSM2_CONF="$no_template/missing-override.conf" \
            "$kit/bin/portable-token-e2e" probe "$no_template/libsofthsm2.so"
          grep -F 'directories.tokendir = tokens' \
            "$generated_home/softhsm/softhsm.conf"
          test -d "$generated_home/softhsm/tokens"
          test ! -e "$no_template/tokens"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$generated_home/softhsm/softhsm.conf"
          HOME="$generated_home" P11_PROFILE_EXPECTED_LABEL='Rutoken ECP <no label>' \
            "$kit/bin/portable-token-e2e" rutoken-profile \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          export HOME="$RUNNER_TEMP/softhsm-exclusion-home"
          mkdir -p "$HOME"
          sed -i 's/^INITIALIZE_TOKEN=AUTO$/INITIALIZE_TOKEN=YES/' "$kit/testkit.conf"
          sed -i 's/^EXCLUDED_FUNCTIONS=$/EXCLUDED_FUNCTIONS=C_InitToken,C_InitPIN,C_SetPIN/' \
            "$kit/testkit.conf"
          if bash "$kit/run-test.sh" > "$RUNNER_TEMP/exclusion-gate.log" 2>&1; then
            echo "excluded C_InitToken unexpectedly passed" >&2
            exit 1
          fi
          grep -F 'blocked excluded PKCS #11 function before invocation: C_InitToken' \
            "$RUNNER_TEMP/exclusion-gate.log"
          if grep -F -- '-> C_InitToken' "$RUNNER_TEMP/exclusion-gate.log"; then
            echo "excluded C_InitToken reached the module" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-x64
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-linux-arm64:
    name: Verify downloaded Linux ARM64 package
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file opensc patchelf perl unzip zip
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-arm64
          path: downloaded
      - name: Build and test downloadable test kit
        env:
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          export HOME="$RUNNER_TEMP/softhsm-user-home"
          mkdir -p "$HOME"
          mkdir -p dist artifact-testkit
          scripts/portable/build-test-kit-unix.sh linux-arm64
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-linux-arm64.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh"
          P11_TEST_OBJECT_ID_HEX=504f525441424c46 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-alternate \
            bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          test ! -e "$GITHUB_WORKSPACE/downloaded/tokens"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$HOME/softhsm/softhsm.conf"
          "$RUNNER_TEMP/packaged-testkit/bin/portable-token-e2e" rutoken-profile \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          P11_TEST_TOKEN_LABEL=portable-ci-token \
          P11_TEST_OBJECT_ID_HEX=504f525441424c47 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-rutoken \
            bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so"
          generated_home="$RUNNER_TEMP/softhsm-generated-home"
          no_template="$RUNNER_TEMP/softhsm-no-template"
          mkdir -p "$generated_home" "$no_template"
          cp "$GITHUB_WORKSPACE/downloaded/libsofthsm2.so" "$no_template/libsofthsm2.so"
          HOME="$generated_home" "$RUNNER_TEMP/packaged-testkit/bin/portable-token-e2e" probe \
            "$no_template/libsofthsm2.so"
          test -f "$generated_home/softhsm/softhsm.conf"
          test -d "$generated_home/softhsm/tokens"
          test ! -e "$no_template/tokens"
          unzip -q dist/softhsm-testkit-linux-arm64.zip -d artifact-testkit
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-arm64
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-windows-x64:
    name: Verify downloaded Windows x64 package
    needs: build-windows-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-x64
          path: downloaded
      - name: Build and test downloadable test kit
        shell: cmd
        env:
          PORTABLE_ARCH: x64
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-x64.zip' -DestinationPath $env:RUNNER_TEMP\packaged-testkit"
          set "USERPROFILE=%RUNNER_TEMP%\softhsm-user-home"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_OBJECT_ID_HEX=504f525441424c46"
          set "P11_TEST_KEY_LABEL=portable-ci-rsa-alternate"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd" "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_OBJECT_ID_HEX="
          set "P11_TEST_KEY_LABEL="
          if exist "%CD%\downloaded\tokens" exit /b 1
          powershell -NoProfile -Command "(Get-Content -Raw '%USERPROFILE%\softhsm\softhsm.conf').Replace('FAKE_RUTOKEN_ECP = false','FAKE_RUTOKEN_ECP = true') | Set-Content -NoNewline -Encoding ascii '%USERPROFILE%\softhsm\softhsm.conf'"
          "%RUNNER_TEMP%\packaged-testkit\bin\portable-token-e2e.exe" rutoken-profile "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_TOKEN_LABEL=portable-ci-token"
          set "P11_TEST_OBJECT_ID_HEX=504f525441424c47"
          set "P11_TEST_KEY_LABEL=portable-ci-rsa-rutoken"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd" "%CD%\downloaded\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "P11_TEST_TOKEN_LABEL="
          set "P11_TEST_OBJECT_ID_HEX="
          set "P11_TEST_KEY_LABEL="
          set "USERPROFILE=%RUNNER_TEMP%\softhsm-generated-home"
          mkdir "%RUNNER_TEMP%\softhsm-no-template"
          copy /y "%CD%\downloaded\softhsm2.dll" "%RUNNER_TEMP%\softhsm-no-template\softhsm2.dll"
          "%RUNNER_TEMP%\packaged-testkit\bin\portable-token-e2e.exe" probe "%RUNNER_TEMP%\softhsm-no-template\softhsm2.dll"
          if errorlevel 1 exit /b %ERRORLEVEL%
          if not exist "%USERPROFILE%\softhsm\softhsm.conf" exit /b 1
          if not exist "%USERPROFILE%\softhsm\tokens" exit /b 1
          if exist "%RUNNER_TEMP%\softhsm-no-template\tokens" exit /b 1
