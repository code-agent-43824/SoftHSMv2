name: Portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v2.7.0-portable.9

permissions:
  contents: read

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  BOTAN_VERSION: 2.19.5
  BOTAN_SHA256: dfeea0e0a6f26d6724c4af01da9a7b88487adb2d81ba7c72fcaf52db522c9ad4

jobs:
  build-linux-x64:
    name: Build Linux x64 (glibc 2.31)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 xz-utils zip
      - uses: actions/checkout@v7
      - name: Build package
        env:
          PORTABLE_ARCH: x64
        run: scripts/portable/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-x64
          path: dist/softhsm-portable-linux-x64.zip
          if-no-files-found: error
          retention-days: 90

  build-linux-arm64:
    name: Build Linux ARM64 (glibc 2.31)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl perl pkg-config python3 xz-utils zip
      - uses: actions/checkout@v7
      - name: Build package
        env:
          PORTABLE_ARCH: arm64
        run: scripts/portable/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-linux-arm64
          path: dist/softhsm-portable-linux-arm64.zip
          if-no-files-found: error
          retention-days: 90

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: x64
        run: scripts\portable\build-windows.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-x64
          path: dist/softhsm-portable-windows-x64.zip
          if-no-files-found: error
          retention-days: 90

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
        run: scripts\portable\build-windows.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-windows-arm64
          path: dist/softhsm-portable-windows-arm64.zip
          if-no-files-found: error
          retention-days: 90

  build-macos-universal:
    name: Build macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build package
        run: scripts/portable/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-portable-macos-universal
          path: dist/softhsm-portable-macos-universal.zip
          if-no-files-found: error
          retention-days: 90

  verify-linux-x64:
    name: Verify downloaded Linux x64 package
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file perl unzip zip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-x64
          path: downloaded
      - name: Build and test downloadable test kit
        run: |
          scripts/portable/build-test-kit-unix.sh linux-x64
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-linux-x64.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" \
            downloaded/softhsm-portable-linux-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-x64
          path: dist/softhsm-testkit-linux-x64.zip
          if-no-files-found: error
          retention-days: 90

  verify-linux-arm64:
    name: Verify downloaded Linux ARM64 package
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install minimal test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file perl unzip zip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-linux-arm64
          path: downloaded
      - name: Build and test downloadable test kit
        run: |
          scripts/portable/build-test-kit-unix.sh linux-arm64
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-linux-arm64.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" \
            downloaded/softhsm-portable-linux-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-linux-arm64
          path: dist/softhsm-testkit-linux-arm64.zip
          if-no-files-found: error
          retention-days: 90

  verify-windows-x64:
    name: Verify downloaded Windows x64 package
    needs: build-windows-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-x64
          path: downloaded
      - name: Build and test downloadable test kit
        shell: cmd
        env:
          PORTABLE_ARCH: x64
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-x64.zip' -DestinationPath $env:RUNNER_TEMP\packaged-testkit"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd" downloaded\softhsm-portable-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-windows-x64
          path: dist/softhsm-testkit-windows-x64.zip
          if-no-files-found: error
          retention-days: 90

  verify-windows-arm64:
    name: Verify downloaded Windows ARM64 package
    needs: build-windows-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-windows-arm64
          path: downloaded
      - name: Build and test downloadable test kit
        shell: cmd
        env:
          PORTABLE_ARCH: arm64
        run: |
          call scripts\portable\build-test-kit-windows.cmd
          powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist\softhsm-testkit-windows-arm64.zip' -DestinationPath $env:RUNNER_TEMP\packaged-testkit"
          call "%RUNNER_TEMP%\packaged-testkit\run-test.cmd" downloaded\softhsm-portable-windows-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-windows-arm64
          path: dist/softhsm-testkit-windows-arm64.zip
          if-no-files-found: error
          retention-days: 90

  verify-macos-universal:
    name: Verify downloaded macOS universal package
    needs: build-macos-universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-macos-universal
          path: downloaded
      - name: Build and test downloadable test kit
        run: |
          scripts/portable/build-test-kit-unix.sh macos-universal
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-macos-universal.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" \
            downloaded/softhsm-portable-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-macos-universal
          path: dist/softhsm-testkit-macos-universal.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish all verified portable packages
    needs:
      - verify-linux-x64
      - verify-linux-arm64
      - verify-windows-x64
      - verify-windows-arm64
      - verify-macos-universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: softhsm-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "SoftHSM portable $RELEASE_TAG" \
              --notes "Portable, installer-free PKCS #11 modules and independently downloadable self-contained test kits for Linux x64/ARM64, Windows x64/ARM64, and macOS universal. Each fresh verification runner builds its own test kit, executes that exact packaged kit against the separately downloaded product ZIP, and uploads both the precompiled C++ PKCS #11 client and pinned static OpenSSL reference environment. Test kits include launchers, source, PKCS #11 headers, licenses, and an exact environment manifest; no compiler, SDK, Java, Botan, or separately installed OpenSSL is required to rerun them. SHA256SUMS covers all five product archives and all five test-kit archives."
          fi
