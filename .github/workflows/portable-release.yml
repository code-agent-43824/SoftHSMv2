  verify-macos-universal:
    name: Verify downloaded macOS universal package
    needs: build-macos-universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-macos-universal
          path: downloaded
      - name: Build and test downloadable test kit
        env:
          PORTABLE_PRODUCT_DIR: downloaded
        run: |
          export HOME="$RUNNER_TEMP/softhsm-user-home"
          mkdir -p "$HOME"
          mkdir -p dist artifact-testkit
          scripts/portable/build-test-kit-unix.sh macos-universal
          mkdir "$RUNNER_TEMP/packaged-testkit"
          unzip -q dist/softhsm-testkit-macos-universal.zip -d "$RUNNER_TEMP/packaged-testkit"
          bash "$RUNNER_TEMP/packaged-testkit/run-test.sh"
          P11_TEST_OBJECT_ID_HEX=504f525441424c46 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-alternate \
            bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib"
          test ! -e "$GITHUB_WORKSPACE/downloaded/tokens"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$HOME/softhsm/softhsm.conf"
          "$RUNNER_TEMP/packaged-testkit/bin/portable-token-e2e" rutoken-profile \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib"
          P11_TEST_TOKEN_LABEL=portable-ci-token \
          P11_TEST_OBJECT_ID_HEX=504f525441424c47 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-rutoken \
            bash "$RUNNER_TEMP/packaged-testkit/run-test.sh" \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib"
          generated_home="$RUNNER_TEMP/softhsm-generated-home"
          no_template="$RUNNER_TEMP/softhsm-no-template"
          mkdir -p "$generated_home" "$no_template"
          cp "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib" "$no_template/libsofthsm2.dylib"
          HOME="$generated_home" "$RUNNER_TEMP/packaged-testkit/bin/portable-token-e2e" probe \
            "$no_template/libsofthsm2.dylib"
          test -f "$generated_home/softhsm/softhsm.conf"
          test -d "$generated_home/softhsm/tokens"
          test ! -e "$no_template/tokens"
          unzip -q dist/softhsm-testkit-macos-universal.zip -d artifact-testkit
      - uses: actions/upload-artifact@v7
        with:
          name: softhsm-testkit-macos-universal
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish all verified portable packages
    # Automatic runs build and verify; they do not publish. Release tags are
    # numbered by hand and never reused, so a tag is only cut on dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs:
      - verify-linux-x64
      - verify-linux-arm64
      - verify-windows-x86
      - verify-windows-x64
      - verify-windows-arm64
      - verify-macos-universal
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: softhsm-*
          path: release-input
      - name: Create release archives and checksums
        run: |
          mkdir release-assets
          count=0
          for source in release-input/softhsm-*; do
            name=$(basename "$source")
            (cd "$source" && zip -X -9 -r "$GITHUB_WORKSPACE/release-assets/$name.zip" .)
            count=$((count + 1))
          done
          test "$count" -eq 12
          (cd release-assets && sha256sum *.zip > SHA256SUMS)
      - name: Verify release archive layout
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 12
          for archive in release-assets/*.zip; do
            if zipinfo -1 "$archive" | grep -Eq '\.zip$'; then
              echo "nested ZIP found in $archive" >&2
              exit 1
            fi
            case "$(basename "$archive")" in
              softhsm-testkit-windows-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'bin/pkcs11-tool.exe' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'LICENSE-OpenSC.txt' >/dev/null
                ;;
              softhsm-testkit-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'bin/pkcs11-tool' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'LICENSE-OpenSC.txt' >/dev/null
                if zipinfo -1 "$archive" | grep -Fx 'bin/opensc-lib/pkcs11-tool' >/dev/null; then
                  echo "duplicate pkcs11-tool found in $archive" >&2
                  exit 1
                fi
                ;;
            esac
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_COMMIT" \
              --title "SoftHSM portable $RELEASE_TAG" \
              --notes "Portable, installer-free PKCS #11 modules and independently downloadable self-contained test kits for Linux x64/ARM64, Windows x86/x64/ARM64, and macOS universal. Every portable module copy uses exactly one per-user configuration and store: ~/softhsm/softhsm.conf and ~/softhsm/tokens (under %USERPROFILE% on Windows). The module creates them on first use and deliberately ignores SOFTHSM2_CONF, adjacent files, working-directory files, and system configuration paths. Test-kit launchers load modules in place and retain all scenario evidence under test-output inside the extracted kit; they do not copy files into temporary directories. AUTO initializes the selected SoftHSM token and user PIN only when the canonical store is empty, for both bundled and explicitly supplied modules; later runs reuse it and replace only the configured test IDs. The complete GOST/RSA/CSR/certificate/CMS test then reloads the module and proves the resulting persistent objects are usable without C_InitToken, C_InitPIN, or C_SetPIN. Every test kit also contains a ready-to-run OpenSC pkcs11-tool and its non-system dependencies; the launcher finishes by requiring pkcs11-tool -I and -T to load the selected module, without a separate OpenSC installation. FAKE_RUTOKEN_ECP changes only the external Rutoken ECP 2.19 presentation and does not alter the object store or cryptographic semantics. All six platform builds are verified on separate fresh runners."
          fi
