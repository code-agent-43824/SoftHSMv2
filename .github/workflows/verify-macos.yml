name: Verify macOS packages

# Called by portable-release.yml once per Mac processor, as soon as the
# universal build has finished: its product and test kit archives, downloaded
# on a fresh runner and checked as an outside user would use them, the test
# kit's TLS block included.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to verify on
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Downloaded universal packages
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-portable-macos-universal
          path: downloaded
      - uses: actions/download-artifact@v8
        with:
          name: softhsm-testkit-macos-universal
          path: packaged-testkit
      - name: Test the downloaded test kit
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/softhsm-user-home"
          mkdir -p "$HOME"
          cmp "$GITHUB_WORKSPACE/packaged-testkit/libsofthsm2.dylib" \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib"
          P11_TLS_REQUIRED=1 bash "$GITHUB_WORKSPACE/packaged-testkit/run-test.sh" 2>&1 | \
            tee "$RUNNER_TEMP/default-test.log"
          grep -F '[TLS] PASS: TLS with the client key in the module under FAKE_RUTOKEN_ECP' \
            "$RUNNER_TEMP/default-test.log"
          test -d "$GITHUB_WORKSPACE/packaged-testkit/tokens"
          test ! -e "$HOME/softhsm"
          P11_TEST_OBJECT_ID_HEX=504f525441424c46 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-alternate \
            bash "$GITHUB_WORKSPACE/packaged-testkit/run-test.sh" \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib"
          test ! -e "$GITHUB_WORKSPACE/downloaded/tokens"
          perl -0pi -e 's/FAKE_RUTOKEN_ECP = false/FAKE_RUTOKEN_ECP = true/' \
            "$HOME/softhsm/softhsm.conf"
          P11_TEST_USER_PIN=12345678 \
            "$GITHUB_WORKSPACE/packaged-testkit/bin/portable-token-e2e" rutoken-profile \
            "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib"
          P11_TEST_TOKEN_LABEL=portable-ci-token \
          P11_TEST_OBJECT_ID_HEX=504f525441424c47 \
          P11_TEST_KEY_LABEL=portable-ci-rsa-rutoken \
            bash "$GITHUB_WORKSPACE/packaged-testkit/run-test.sh" \
              "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib"
          generated_home="$RUNNER_TEMP/softhsm-generated-home"
          no_template="$RUNNER_TEMP/softhsm-no-template"
          mkdir -p "$generated_home" "$no_template"
          cp "$GITHUB_WORKSPACE/downloaded/libsofthsm2.dylib" "$no_template/libsofthsm2.dylib"
          HOME="$generated_home" "$GITHUB_WORKSPACE/packaged-testkit/bin/portable-token-e2e" probe \
            "$no_template/libsofthsm2.dylib"
          test -f "$generated_home/softhsm/softhsm.conf"
          test -d "$generated_home/softhsm/tokens"
          test ! -e "$no_template/tokens"
